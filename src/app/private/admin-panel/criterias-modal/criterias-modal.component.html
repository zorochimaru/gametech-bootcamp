<div class="dialog-container">
  <header><h2>Confirmation</h2></header>
  <div class="criterias-container">
    <button
      type="button"
      matTooltip="Fetch current criterias"
      mat-fab
      (click)="fetchCriterias()">
      <mat-icon>cloud_download</mat-icon>
    </button>

    <button
      type="button"
      matTooltip="Save criterias"
      mat-fab
      (click)="onSaveCriterias()">
      <mat-icon>check</mat-icon>
    </button>
  </div>

  <div class="actions-container">
    <button mat-button cdkFocusInitial>No</button>
    <button mat-button>Yes</button>
  </div>
</div>
